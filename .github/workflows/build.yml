name: Build DePuke Package

on:
  push:
    branches: [ main, master, dist ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, dist ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rootless .deb
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDKs
        run: |
          rm -rf ~/theos/sdks
          git clone --quiet --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Compile & Package Rootless Tweak
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DePuke-Rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          name: "DePuke ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
