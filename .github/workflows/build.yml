name: Build DePuke Package

on:
  push:

    branches: [ main, master ]

    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, dist ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.scheme }} .deb
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos: https://github.com/theos/theos.git
          - scheme: roothide
            theos: https://github.com/roothide/theos.git

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        run: |
          git clone --recursive ${{ matrix.theos }} ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDKs
        run: |
          rm -rf ~/theos/sdks
          git clone --quiet --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Compile & Package (${{ matrix.scheme }})
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DePuke-${{ matrix.scheme }}-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          name: "DePuke ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
